name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LMS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish LMS APK v1.2 release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Publish LMS APK v1.2 release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: LMS Android App v1.2
          body: |
            LMS Android app with corrected website URL and improved WebView loading,
            navigation, saved state, and retry handling.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
